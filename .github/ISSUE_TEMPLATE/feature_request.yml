name: Feature request
description: Propose a requirement aligned with the approved roadmap
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Required HSF policy decisions
